repos:
-   repo: local
    hooks:
      - id: lint
        name: ruff check fix
        entry: bash -c 'uvx ruff check --fix'
        language: system
        pass_filenames: false
        stages: [pre-commit]
-   repo: local
    hooks:
      - id: lint
        name: ruff format
        entry: bash -c 'uvx ruff format'
        language: system
        pass_filenames: false
        stages: [pre-commit]
-   repo: local
    hooks:
      - id: type-check
        name: ty
        entry: bash -c 'uvx ty check src'
        language: system
        pass_filenames: false
        stages: [pre-commit]