dependencies = [
    "alembic >= 1.14.0",
    "fastapi >= 0.115.5",
    "sqlalchemy[asyncio] >= 2.0.36",
    "uvicorn[standard] >= 0.32.1",
    "gunicorn >= 23.0.0",
    "pyjwt >= 2.10.1",
    "bcrypt >= 4.2.1",
    "pydantic[email] >= 2.10.2",
    "asyncpg >= 0.30.0",
