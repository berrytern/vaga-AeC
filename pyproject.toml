    "pytest >= 8.3.3",
    "pre-commit >= 4.0.1",
    "black >= 24.10.0",
    "flake8 >= 7.1.1",
    "pytest-cov >= 6.0.0",
    "pytest-asyncio >= 0.24.0",
    "mypy >= 1.14.0"
]

[tool.pytest.ini_options]
